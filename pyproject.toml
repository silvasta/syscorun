[project]
name = "syscorun"
classifiers = ["Development Status :: 3 - Alpha"]
version = "0.1.1b1"
description = "Execution of system and control tools"
keywords = [
  "science",
  "engineering",
  "education",
  "systems",
  "controls",
  "controller",
  "discrete-time",
  "model-based",
  "data-driven",
]
license = { text = "Apache License 2.0" }
readme = "README.md"
authors = [{ name = "Silvan Stadelmann", email = "silvasta3@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "loguru>=0.7.3",
  "rich>=14.1.0",
  "sympy>=1.14.0",
  "sysco",
  "syscovis",
  "textual>=7.2.0",
  "typer>=0.21.1",
]

[project.urls]
# Documentation = ""
Repository = "https://github.com/silvasta/syscorun"
# Issues = ""
# Changelog = ""

[project.scripts]
# TODO: remove alias
scr = "syscorun.cli:main"
syscorun-cli = "syscorun.cli:main"
syscorun-tui = "syscorun.tui:main"
tail-log = "syscorun.utils.tail_logs:main"

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
syscovis = { path = "../syscovis", editable = true }
sysco = { path = "../sysco", editable = true }

[tool.project_name.logging]
level = "DEBUG"
file_name = "syscorun.log"
rotation = "1 MB"
retention = "1 week"
